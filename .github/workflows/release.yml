name: Build DBX review candidates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

concurrency:
  group: xxl-job-console-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Verify release tag
        run: test "${RELEASE_TAG}" = "v$(node -p 'require("./manifest.json").version')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go -C backend test -race ./...
      - run: go -C backend vet ./...
      - run: npm run package:all
      - name: Verify native package protocol
        run: |
          arch=$(node -p 'process.arch === "arm64" ? "arm64" : "x64"')
          id=$(node -p 'require("./manifest.json").id')
          version=$(node -p 'require("./manifest.json").version')
          go run scripts/verify-package.go "dist/${id}-${version}-darwin-${arch}.dbxp" --handshake
      - name: Upload unsigned candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/*.dbxp dist/*.artifact.json dist/SHA256SUMS-*.txt dist/release-candidates.json
